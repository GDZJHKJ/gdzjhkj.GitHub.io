<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>好彩U · 扫码收款</title>
<style>
*{box-sizing:border-box}
:root{
  --ink:#0B1A13;--muted:#6B7A72;--line:rgba(12,27,20,.10);
  --bg:#F3F6F4;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);
  background:
    radial-gradient(120% 80% at 50% -10%,#DFF6EA 0%,rgba(223,246,234,0) 60%),
    radial-gradient(90% 60% at 100% 100%,#E8F1EC 0%,rgba(232,241,236,0) 55%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;padding:22px 18px;
  -webkit-tap-highlight-color:transparent;
}
.card{
  width:100%;max-width:392px;padding:26px 22px 22px;border-radius:26px;
  background:rgba(255,255,255,.84);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 22px 60px -24px rgba(9,48,32,.35),0 2px 8px rgba(9,48,32,.06);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  text-align:center;
}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:14px}
.mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;
  background:linear-gradient(150deg,#17B978,#06513A);box-shadow:0 6px 14px -6px rgba(9,80,52,.55)}
.brand b{font-size:15px;letter-spacing:-.2px}
h1{margin:2px 0 4px;font-size:22px;letter-spacing:-.6px}
.sub{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:6px 12px;border-radius:999px;
  font-size:12px;font-weight:600;background:rgba(14,158,106,.10);color:#0A7A52}
.dot{width:7px;height:7px;border-radius:50%;background:#12B76A}
.qrwrap{display:inline-block;padding:12px;border-radius:20px;background:#fff;
  box-shadow:0 10px 28px -16px rgba(9,48,32,.4),0 0 0 1px rgba(12,27,20,.06)}
#qr{display:block;width:236px;height:236px;border-radius:10px}
.acts{display:grid;gap:10px;margin-top:18px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:15px;font-size:15px;font-weight:650;letter-spacing:-.2px;
  color:#fff;background:linear-gradient(180deg,#12B378,#0A7A52);
  box-shadow:0 12px 26px -14px rgba(10,122,82,.75);cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn:disabled{opacity:.5}
.setup{margin:14px 0 0;padding:13px;border-radius:14px;background:#F4F8F5;border:1px solid #E4EDE7}
.setup.hide{display:none}
.setup-t{font-size:12px;line-height:1.6;color:#6C7A73;margin-bottom:9px}
.setup input{width:100%;box-sizing:border-box;margin-bottom:7px;padding:10px 11px;font-size:12.5px;border:1px solid #DCE6E0;border-radius:10px;background:#fff;color:#14251C;outline:none}
.setup input:focus{border-color:#1F7A53}
.setup .btn{width:100%}
.tip{margin:16px 0 0;font-size:12px;color:var(--muted);line-height:1.7}
.tip b{color:#0A7A52}
.switch{display:flex;gap:8px;margin:0 0 14px;padding:4px;border-radius:13px;background:rgba(12,27,20,.05)}
.switch button{flex:1;padding:9px;border:0;border-radius:10px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.switch button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -10px rgba(9,48,32,.5)}
.resetline{margin:6px 0 0;text-align:center}
.resetline button{border:0;background:none;font-size:11px;color:#A7B4AD;text-decoration:underline;padding:4px}
.srcline{margin:10px 0 0;font-size:11px;color:#93A29B;text-align:center}
.foot{margin-top:18px;font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.foot svg{width:12px;height:12px;opacity:.7}
.hide{display:none!important}

  /* 隐藏托管平台自动注入的水印（GitHub / 自有域名本就没有） */
  doubao-watermark, [data-custom-element="doubao-watermark"],
  [data-custom-element$="-watermark"], [data-custom-element$="-watermark-mobile"] {
    display: none !important; visibility: hidden !important; opacity: 0 !important;
    width: 0 !important; height: 0 !important; overflow: hidden !important;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark">U</span><b>好彩U</b></div>
  <h1>扫码付款</h1>
  <p class="sub" id="sub">正在识别扫码方式</p>

  <div class="switch" id="tabs">
    <button data-k="wx" class="on">方式一</button>
    <button data-k="ali">方式二</button>
  </div>

  <span class="badge"><span class="dot"></span><span id="badgeTxt">正在准备</span></span>

  <div class="qrwrap"><canvas id="qr"></canvas></div>

  <div class="acts">
    <button class="btn" id="go">打开并付款</button>
    <button class="btn ghost" id="copy">复制收款链接</button>
  </div>

  <div class="setup hide" id="setup">
    <div class="setup-t">只有这台设备要看？把另一条收款链接粘贴一次，之后直接打开这个网址也能用。</div>
    <input id="setupW" inputmode="text" placeholder="方式一链接：wxp://…" autocomplete="off">
    <input id="setupA" inputmode="text" placeholder="方式二链接：https://qr.alipay.com/…" autocomplete="off">
    <button class="btn ghost" id="setupOk">保存到本机</button>
  </div>

  <p class="tip" id="tip">按钮没反应时，<b>长按上方二维码</b>识别即可付款。</p>
  <div class="srcline" id="srcline"></div>
  <div class="resetline"><button id="resetCache" type="button">清除本机记忆</button></div>
  <div class="foot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    本页在本机渲染 · 不收集任何信息
  </div>
</div>

      var k = i < 0 ? kv : kv.slice(0, i);
      var v = i < 0 ? '' : kv.slice(i + 1);
      try { v = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) {}
      out[k] = v;
    });
    return out;
  }
  function readParams() {
    var q = parsePairs(location.search.replace(/^\?/, ''));
    var h = parsePairs(location.hash.replace(/^#/, ''));
    var out = {};
    ['w', 'a', 'wx', 'ali'].forEach(function (k) {
      if (q[k]) out[k] = q[k];
      if (h[k]) out[k] = h[k];
    });
    return out;
  }
  function safe(v) {
    v = String(v || '').trim();
    return /^(wxp|weixin|alipays|alipay|https?):\/\//i.test(v) ? v : '';
  }

  var hp = readParams();
  var cache = {};
  try { cache = JSON.parse(localStorage.getItem('haocaiu-pay') || '{}') || {}; } catch (e) { cache = {}; }
  var SRC = { w: '默认', a: '默认' };
  var fromParams = !!(safe(hp.w) || safe(hp.a));
  var wx = fromParams ? safe(hp.w) : (safe(CFG.wx) || safe(cache.w));
  var ali = fromParams ? safe(hp.a) : (safe(CFG.ali) || safe(cache.a));
  if (fromParams) {
    SRC.w = safe(hp.w) ? '本次扫码' : '本次扫码未带';
    SRC.a = safe(hp.a) ? '本次扫码' : '本次扫码未带';
    try { localStorage.setItem('haocaiu-pay', JSON.stringify({ w: wx, a: ali })); } catch (e) {}
  } else {
    SRC.w = safe(CFG.wx) ? '页面内置' : (safe(cache.w) ? '本机记忆' : '未配置');
    SRC.a = safe(CFG.ali) ? '页面内置' : (safe(cache.a) ? '本机记忆' : '未配置');
  }
  var ua = navigator.userAgent || '';
  var isWx = /MicroMessenger/i.test(ua);
  var isAli = /AlipayClient/i.test(ua);

  var cur = isAli ? 'ali' : 'wx';
  var cv = document.getElementById('qr');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(3, window.devicePixelRatio || 1);
  var CSSQ = 236;
  cv.width = CSSQ * dpr; cv.height = CSSQ * dpr;
  cv.style.width = CSSQ + 'px'; cv.style.height = CSSQ + 'px';

  function renderQR(text) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, CSSQ, CSSQ);
    if (!text) {
      ctx.fillStyle = '#9AA7A0';
      ctx.font = '600 13px -apple-system,"PingFang SC",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('请从收款码进入', CSSQ / 2, CSSQ / 2);
      return;
    }
    var q = qrcode(0, 'M');
    q.addData(text, 'Byte');
    q.make();
    var n = q.getModuleCount(), quiet = 3;
    var mod = Math.max(1, Math.floor((CSSQ - 18) / (n + quiet * 2)));
    var total = mod * (n + quiet * 2);
    var ox = Math.round((CSSQ - total) / 2) + quiet * mod;
    var oy = ox;
    ctx.fillStyle = '#0A0F0C';
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (q.isDark(r, c)) ctx.fillRect(ox + c * mod, oy + r * mod, mod, mod);
      }
    }
  }

  var badgeTxt = document.getElementById('badgeTxt');
  var sub = document.getElementById('sub');
  var tip = document.getElementById('tip');
  var goBtn = document.getElementById('go');
  var copyBtn = document.getElementById('copy');
  var tabs = document.getElementById('tabs');

  function paintSrc() {
    var el = document.getElementById('srcline');
    if (!el) return;
    el.textContent = '当前链接：方式一 → ' + (SRC.w || '默认') + '｜方式二 → ' + (SRC.a || '默认');
  }

  function paint(k) {
    cur = k;
    var link = k === 'ali' ? ali : wx;
    Array.prototype.forEach.call(tabs.children, function (b) {
      b.classList.toggle('on', b.getAttribute('data-k') === k);
    });
    badgeTxt.textContent = k === 'ali' ? '方式二 · 已识别' : '方式一 · 已识别';
    sub.textContent = isAli ? '已按方式二的入口打开' : (isWx ? '已按方式一的入口打开' : '请选择你正在使用的扫码方式');
    renderQR(link);
    goBtn.disabled = !link;
    goBtn.textContent = link ? '打开并付款' : '尚未配置该方式';
    copyBtn.disabled = !link;
    tip.innerHTML = link
      ? '按钮没反应时，<b>长按上方二维码</b>识别即可付款。'
      : '这个地址需要从收款码扫码打开才会带上收款信息；直接打开只会显示当前状态。';
  }

  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    paint(b.getAttribute('data-k'));
  });

  goBtn.addEventListener('click', function () {
    var link = cur === 'ali' ? ali : wx;
    if (!link) return;
    try {
      if (cur === 'ali') location.href = link;
      else location.href = link;
    } catch (e) {
      tip.innerHTML = '当前浏览器不允许直接跳转，请<b>长按上方二维码</b>识别付款。';
    }
  });

  var setupBox = document.getElementById('setup');
  var setupW = document.getElementById('setupW');
  var setupA = document.getElementById('setupA');
  var setupOk = document.getElementById('setupOk');

  function syncSetup() {
    if (!setupBox) return;
    if (wx && ali) { setupBox.classList.add('hide'); return; }
    setupBox.classList.remove('hide');
    if (!setupW.value && !wx) setupW.value = '';
    if (!setupA.value && !ali) setupA.value = '';
  }

  if (setupOk) setupOk.addEventListener('click', function () {
    var w = safe(setupW.value), a = safe(setupA.value);
    if (!w && !a) return;
    wx = w || wx; ali = a || ali;
    try { localStorage.setItem('haocaiu-pay', JSON.stringify({ w: wx, a: ali })); } catch (e) {}
    syncSetup(); paint();
  });

  copyBtn.addEventListener('click', function () {
    var link = cur === 'ali' ? ali : wx;
    if (!link) return;
    var ok = function () { copyBtn.textContent = '已复制'; setTimeout(function () { copyBtn.textContent = '复制收款链接'; }, 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(ok, ok);
    } else {
      var ta = document.createElement('textarea');
      ta.value = link; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); ok();
    }
  });

  if (!wx && ali) cur = 'ali';
  paint(cur);
  syncSetup();
  paintSrc();
  var rc = document.getElementById('resetCache');
  if (rc) rc.addEventListener('click', function () {
    try { localStorage.removeItem('haocaiu-pay'); } catch (e) {}
    rc.textContent = '已清除，请重新扫码';
    setTimeout(function () { location.reload(); }, 600);
  });

  var DEBUG = /[?&]debug=1/.test(location.search);
  if (!DEBUG && isAli && ali) {
    setTimeout(function () { try { location.href = ali; } catch (e) {} }, 500);
  }
  if (!DEBUG && isWx && wx) {
    setTimeout(function () { try { location.href = wx; } catch (e) {} }, 500);
  }
  if ((isWx || isAli) && tabs && (!wx || !ali)) tabs.classList.remove('hide');
  else if ((isWx || isAli) && tabs) tabs.classList.add('hide');
})();

  /* 移除托管平台注入的水印节点 */
  (function () {
    var kill = function () {
      var list = document.querySelectorAll('[data-custom-element="doubao-watermark"],[data-custom-element$="-watermark"]');
      for (var i = 0; i < list.length; i++) {
        try { list[i].parentNode && list[i].parentNode.removeChild(list[i]); } catch (e) {}
      }
    };
    kill();
    try {
      var mo = new MutationObserver(kill);
      mo.observe(document.body, { childList: true });
    } catch (e) {}
    setTimeout(kill, 400); setTimeout(kill, 1200); setTimeout(kill, 2500);
  })();
</script>
</body>
</html>
